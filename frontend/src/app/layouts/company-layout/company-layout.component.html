<div class="company-layout">
  <!-- Mobile header -->
  <header class="company-header">
    <button class="company-header__toggle" (click)="toggleSidebar()">
      <lucide-icon name="menu" [size]="22"></lucide-icon>
    </button>
    <a routerLink="/company" class="company-header__logo">
      <img src="devport-logo-black.png" alt="Dev Port" class="company-header__logo-img">
    </a>
    <a routerLink="/company/profile" class="company-header__avatar">
      @if (profileLogo()) {
        <img [src]="profileLogo()" [alt]="profileName()" class="company-header__avatar-img">
      } @else {
        <span class="company-header__avatar-initial">{{ profileInitial() }}</span>
      }
    </a>
  </header>

  <!-- Backdrop -->
  @if (sidebarOpen()) {
    <div class="company-layout__backdrop" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar -->
  <aside class="company-sidebar" [class.company-sidebar--open]="sidebarOpen()">
    <div class="company-sidebar__header">
      <a routerLink="/company" class="company-sidebar__logo" (click)="closeSidebar()">
        <img src="devport-logo-black.png" alt="Dev Port" class="company-sidebar__logo-img">
      </a>
    </div>

    <nav class="company-sidebar__nav">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="company-sidebar__link--active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="company-sidebar__link"
          (click)="closeSidebar()"
        >
          <lucide-icon [name]="item.icon" [size]="20"></lucide-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="company-sidebar__footer">
      <a routerLink="/company/profile" class="company-sidebar__profile" (click)="closeSidebar()">
        <div class="company-sidebar__profile-avatar">
          @if (profileLogo()) {
            <img [src]="profileLogo()" [alt]="profileName()">
          } @else {
            <span>{{ profileInitial() }}</span>
          }
        </div>
        <div class="company-sidebar__profile-info">
          <span class="company-sidebar__profile-name">{{ profileName() }}</span>
        </div>
      </a>
      <button class="company-sidebar__logout" (click)="logout()">
        <lucide-icon name="log-out" [size]="18"></lucide-icon>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="company-main">
    <router-outlet />
  </main>
</div>
