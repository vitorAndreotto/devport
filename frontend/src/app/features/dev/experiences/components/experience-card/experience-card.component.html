<div class="exp-card" [class.exp-card--editing]="isEditing()">
  @if (isEditing()) {
    <div class="exp-card__form">
      <div class="exp-card__row">
        <input class="exp-card__input exp-card__input--wide" [(ngModel)]="editCompany" placeholder="Empresa" />
        <input class="exp-card__input exp-card__input--wide" [(ngModel)]="editPosition" placeholder="Cargo" />
      </div>
      <textarea class="exp-card__textarea" [(ngModel)]="editDescription" placeholder="Descrição (opcional)" rows="3"></textarea>
      <div class="exp-card__row">
        <input class="exp-card__input" type="date" [(ngModel)]="editStartDate" />
        <input class="exp-card__input" type="date" [(ngModel)]="editEndDate" [disabled]="editIsCurrent()" />
        <label class="exp-card__check">
          <input type="checkbox" [checked]="editIsCurrent()" (change)="onCurrentChange($any($event.target).checked)" />
          Atual
        </label>
      </div>
      <div class="exp-card__form-actions">
        <button class="exp-card__btn exp-card__btn--save" (click)="saveEdit()" [disabled]="saving() || !editCompany() || !editPosition() || !editStartDate()">
          <lucide-icon name="check" [size]="16"></lucide-icon>
          Salvar
        </button>
        <button class="exp-card__btn exp-card__btn--cancel" (click)="cancelEdit()">
          <lucide-icon name="x" [size]="16"></lucide-icon>
          Cancelar
        </button>
      </div>
    </div>
  } @else {
    <div class="exp-card__info">
      <div class="exp-card__header">
        <span class="exp-card__position">{{ experience().position }}</span>
        @if (experience().is_current) {
          <span class="exp-card__badge">Atual</span>
        }
      </div>
      <span class="exp-card__company">{{ experience().company }}</span>
      <span class="exp-card__period">{{ formatPeriod(experience()) }}</span>
      @if (experience().description) {
        <p class="exp-card__description">{{ experience().description }}</p>
      }
    </div>
    <div class="exp-card__actions">
      <button class="exp-card__btn exp-card__btn--edit" (click)="startEdit()">
        <lucide-icon name="edit-3" [size]="15"></lucide-icon>
      </button>
      <button class="exp-card__btn exp-card__btn--delete" (click)="remove.emit()">
        <lucide-icon name="trash-2" [size]="15"></lucide-icon>
      </button>
    </div>
  }
</div>
