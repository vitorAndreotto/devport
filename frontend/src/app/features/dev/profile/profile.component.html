<div class="profile-page">
  <div class="profile-page__header">
    <h1 class="profile-page__title">Meu Perfil</h1>
    <p class="profile-page__subtitle">Gerencie suas informações profissionais.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <!-- Identidade -->
    <section class="form-section">
      <div class="form-section__header">
        <lucide-icon name="user" [size]="20"></lucide-icon>
        <h2 class="form-section__title">Identidade</h2>
      </div>

      <div class="form-section__body">
        <app-handle-input
          [control]="form.controls.handle"
          (statusChange)="onHandleStatus($event)"
        />

        <div class="form-grid">
          <app-form-field label="Nome completo" [control]="form.controls.full_name" [required]="true">
            <input class="input" type="text" formControlName="full_name" placeholder="Seu nome completo">
          </app-form-field>

          <app-form-field label="Cargo / Título" [control]="form.controls.title" [required]="true">
            <input class="input" type="text" formControlName="title" placeholder="Ex: Desenvolvedor Full Stack">
          </app-form-field>
        </div>

        <app-form-field label="Bio" [control]="form.controls.bio" [required]="true">
          <textarea class="input input--textarea" formControlName="bio" placeholder="Conte sobre você..." rows="4"></textarea>
          <span class="char-count">{{ bioLength }}/500</span>
        </app-form-field>

        <div class="form-grid">
          <app-form-field label="E-mail de contato" [control]="form.controls.email_contact" [required]="true">
            <input class="input" type="email" formControlName="email_contact" placeholder="contato@seusite.dev">
          </app-form-field>

          <app-form-field label="URL do Avatar" [control]="form.controls.avatar_url">
            <input class="input" type="url" formControlName="avatar_url" placeholder="https://exemplo.com/foto.jpg">
          </app-form-field>
        </div>
      </div>
    </section>

    <!-- Endereço -->
    <section class="form-section">
      <div class="form-section__header">
        <lucide-icon name="map-pin" [size]="20"></lucide-icon>
        <h2 class="form-section__title">Endereço</h2>
      </div>

      <div class="form-section__body">
        <app-form-field label="CEP" [control]="form.controls.zip_code">
          <div class="cep-field">
            <input
              class="input"
              type="text"
              formControlName="zip_code"
              placeholder="00000-000"
              maxlength="9"
              appCepMask
              (blur)="onCepBlur()"
            >
            @if (isFetchingCep()) {
              <lucide-icon name="loader-2" [size]="16" class="cep-field__spinner spin"></lucide-icon>
            }
          </div>
          <span class="cep-hint">Preencha o CEP para buscar endereço automaticamente</span>
        </app-form-field>

        <div class="form-grid">
          <div class="form-field">
            <label class="form-field__label">Estado</label>
            <select class="input" formControlName="state_id" (change)="onStateChange()">
              <option [ngValue]="null">Selecione o estado</option>
              @for (state of states(); track state.id) {
                <option [ngValue]="state.id">{{ state.name }} ({{ state.abbr }})</option>
              }
            </select>
          </div>

          <app-city-search
            #citySearch
            [stateId]="form.controls.state_id.value"
            [control]="form.controls.city_id"
          />
        </div>

        <div class="form-grid">
          <app-form-field label="Bairro" [control]="form.controls.neighborhood">
            <input class="input" type="text" formControlName="neighborhood" placeholder="Bairro">
          </app-form-field>

          <app-form-field label="Número" [control]="form.controls.number">
            <input class="input" type="text" formControlName="number" placeholder="Nº">
          </app-form-field>
        </div>

        <app-form-field label="Rua / Logradouro" [control]="form.controls.street">
          <input class="input" type="text" formControlName="street" placeholder="Rua, Avenida...">
        </app-form-field>

        <app-form-field label="Complemento" [control]="form.controls.complement">
          <input class="input" type="text" formControlName="complement" placeholder="Apto, Bloco, Sala...">
        </app-form-field>
      </div>
    </section>

    <!-- Preferências -->
    <section class="form-section">
      <div class="form-section__header">
        <lucide-icon name="briefcase" [size]="20"></lucide-icon>
        <h2 class="form-section__title">Preferências de trabalho</h2>
      </div>

      <div class="form-section__body">
        <div class="form-grid">
          <div class="form-field">
            <label class="form-field__label">Modalidade preferida</label>
            <select class="input" formControlName="work_mode">
              <option [ngValue]="null">Sem preferência</option>
              <option value="remote">Remoto</option>
              <option value="hybrid">Híbrido</option>
              <option value="onsite">Presencial</option>
            </select>
          </div>

          <app-form-field label="GitHub username" [control]="form.controls.github_username">
            <div class="input-group">
              <span class="input-group__prefix">
                <lucide-icon name="github" [size]="16"></lucide-icon>
              </span>
              <input class="input input--with-prefix" type="text" formControlName="github_username" placeholder="seu-username">
            </div>
          </app-form-field>
        </div>
      </div>
    </section>

    <!-- Links -->
    <section class="form-section">
      <div class="form-section__header">
        <lucide-icon name="link" [size]="20"></lucide-icon>
        <h2 class="form-section__title">Links externos</h2>
      </div>

      <div class="form-section__body" formArrayName="links">
        @for (link of linksArray.controls; track $index; let i = $index) {
          <div class="link-row" [formGroupName]="i">
            <input class="input link-row__label" type="text" formControlName="label" placeholder="Label (ex: LinkedIn)">
            <input class="input link-row__url" type="url" formControlName="url" placeholder="https://...">
            <button type="button" class="link-row__remove" (click)="removeLink(i)">
              <lucide-icon name="trash-2" [size]="16"></lucide-icon>
            </button>
          </div>
        }

        <button type="button" class="btn-add-link" (click)="addLink()">
          <lucide-icon name="plus" [size]="16"></lucide-icon>
          Adicionar link
        </button>
      </div>
    </section>

    <!-- Submit -->
    <div class="profile-page__actions">
      <button type="submit" class="btn-save" [disabled]="!canSave">
        @if (isSaving()) {
          <lucide-icon name="loader-2" [size]="18" class="spin"></lucide-icon>
          Salvando...
        } @else {
          <lucide-icon name="save" [size]="18"></lucide-icon>
          Salvar alterações
        }
      </button>
    </div>
  </form>
</div>
