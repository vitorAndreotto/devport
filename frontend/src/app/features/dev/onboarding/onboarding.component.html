<div class="onboarding">
  <div class="onboarding__card">
    <div class="onboarding__header">
      <div class="onboarding__icon">
        <lucide-icon name="anchor" [size]="32"></lucide-icon>
      </div>
      <h1 class="onboarding__title">Bem-vindo a bordo!</h1>
      <p class="onboarding__subtitle">Registre sua embarcação para zarpar.</p>
    </div>

    @if (apiError()) {
      <div class="onboarding__alert">{{ apiError() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="onboarding__form">
      <app-handle-input
        [control]="form.controls.handle"
        (statusChange)="onHandleStatus($event)"
      />

      <app-form-field label="Nome do capitão" [control]="form.controls.full_name" [required]="true">
        <input class="input" type="text" formControlName="full_name" placeholder="Seu nome completo">
      </app-form-field>

      <app-form-field label="Posto / Função" [control]="form.controls.title" [required]="true">
        <input class="input" type="text" formControlName="title" placeholder="Ex: Desenvolvedor Full Stack">
      </app-form-field>

      <app-form-field label="Descrição da embarcação" [control]="form.controls.bio" [required]="true">
        <textarea class="input input--textarea" formControlName="bio" placeholder="Descreva sua embarcação e jornada (max 500 caracteres)" rows="3"></textarea>
      </app-form-field>

      <app-form-field label="Rádio de contato" [control]="form.controls.email_contact" [required]="true">
        <input class="input" type="email" formControlName="email_contact" placeholder="contato@seusite.dev">
      </app-form-field>

      <button type="submit" class="onboarding__submit" [disabled]="!canSubmit">
        @if (isLoading()) {
          <lucide-icon name="loader-2" [size]="18" class="spin"></lucide-icon>
          Registrando embarcação...
        } @else {
          <lucide-icon name="anchor" [size]="18"></lucide-icon>
          Lançar ao mar
        }
      </button>
    </form>
  </div>
</div>
