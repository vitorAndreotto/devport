<div class="register">
  <div class="register__card">
    <a routerLink="/" class="register__logo">
      <lucide-icon name="anchor" [size]="24"></lucide-icon>
      Dev<span class="register__logo-accent">Port</span>
    </a>

    <!-- Step 1: Role Selection -->
    @if (!selectedRole()) {
      <div class="register__step">
        <h1 class="register__title">Registrar embarcação</h1>
        <p class="register__subtitle">Você é um navio ou um porto?</p>

        <div class="role-selector">
          <button class="role-card" (click)="selectRole('dev')">
            <div class="role-card__icon">
              <lucide-icon name="anchor" [size]="32"></lucide-icon>
            </div>
            <span class="role-card__title">Navio (Dev)</span>
            <span class="role-card__description">Equipe sua embarcação, trace rotas e navegue até as melhores vagas.</span>
          </button>

          <button class="role-card" (click)="selectRole('company')">
            <div class="role-card__icon">
              <lucide-icon name="building-2" [size]="32"></lucide-icon>
            </div>
            <span class="role-card__title">Porto (Empresa)</span>
            <span class="role-card__description">Abra seu porto, publique rotas e atraia os melhores navios.</span>
          </button>
        </div>

        <p class="register__footer">
          Já zarpou antes? <a routerLink="/auth/login" class="register__link">Embarcar</a>
        </p>
      </div>
    }

    <!-- Step 2: Registration Form -->
    @if (selectedRole()) {
      <app-register-form
        [role]="selectedRole()!"
        (back)="goBack()"
      />
    }
  </div>
</div>
