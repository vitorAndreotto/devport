services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devport-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file: ./backend/.env
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devport-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  pgsql:
    image: postgres:17-alpine
    container_name: devport-pgsql
    env_file: ./database/pgsql/.env
    ports:
      - "5432:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devport"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devport-redis
    env_file: ./database/redis/.env
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgsql-data:
  redis-data:
