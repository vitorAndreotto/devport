<div class="dashboard">
    <div class="dashboard__header">
        <h1 class="dashboard__title">
            Porto <span class="dashboard__name">{{ profileName() }}</span>
        </h1>
        <p class="dashboard__subtitle">Painel do porto. Gerencie suas docas e rotas de navegação.</p>
    </div>

    <div class="dashboard__stats">
        <a routerLink="/company/jobs" class="stat-card stat-card--link">
            <div class="stat-card__icon">
                <lucide-icon name="compass" [size]="22"></lucide-icon>
            </div>
            <div class="stat-card__info">
                <span class="stat-card__value">&mdash;</span>
                <span class="stat-card__label">Vagas</span>
            </div>
        </a>

        <a routerLink="/company/units" class="stat-card stat-card--link">
            <div class="stat-card__icon">
                <lucide-icon name="map-pin" [size]="22"></lucide-icon>
            </div>
            <div class="stat-card__info">
                <span class="stat-card__value">&mdash;</span>
                <span class="stat-card__label">Unidades</span>
            </div>
        </a>

        <div class="stat-card">
            <div class="stat-card__icon">
                <lucide-icon name="anchor" [size]="22"></lucide-icon>
            </div>
            <div class="stat-card__info">
                <span class="stat-card__value">&mdash;</span>
                <span class="stat-card__label">Candidaturas</span>
            </div>
        </div>
    </div>

    <h2 class="dashboard__section-title">Comandos do porto</h2>
    <div class="dashboard__actions">
        @for (action of quickActions; track action.path) {
        <a [routerLink]="action.path" class="action-card">
            <div class="action-card__icon">
                <lucide-icon [name]="action.icon" [size]="22"></lucide-icon>
            </div>
            <div class="action-card__content">
                <span class="action-card__label">{{ action.label }}</span>
                <span class="action-card__description">{{ action.description }}</span>
            </div>
        </a>
        }
    </div>
</div>
